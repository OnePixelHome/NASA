# Builds the game and publishes it to Azure Static Web Apps (victorious-pebble-0fcf34b10) on every push to main.
# This is the only deploy: GitHub Pages is no longer used.
# Requires the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (Azure portal → the Static Web App → Manage deployment token).
# Without that secret the job is skipped instead of failing.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-swa
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.SWA_TOKEN == ''
        run: echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping the Azure deploy."
      - if: env.SWA_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.SWA_TOKEN != ''
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: env.SWA_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.SWA_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.SWA_TOKEN != ''
        run: pnpm test
      # Azure serves the site from the root, so no BASE_PATH.
      - if: env.SWA_TOKEN != ''
        run: pnpm build
      # The leaderboard API (server/azure) is bundled with the game engine into api-build/ and deployed with the site.
      - if: env.SWA_TOKEN != ''
        run: npm install --prefix server/azure --no-audit --no-fund --no-package-lock && node server/azure/build.mjs
      # Vite builds into dist/. The old Azure-generated workflow looked for build/ and failed on every push.
      - if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          api_location: api-build
          output_location: ''
          skip_app_build: true
          skip_api_build: true
