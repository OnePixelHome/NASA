class Component extends DCLogic {
  renderVals() {
    const m = this.props.mission ?? 'crop';
    const L = { crop: 'Farmland patchwork seen from above', storm: 'Hurricane swirl over the ocean', ice: 'Polar ice sheet with floating floes' };
    const d = k => (m === k ? 'inline' : 'none');
    return { label: L[m] || '', crop: d('crop'), storm: d('storm'), ice: d('ice') };
  }
}
</script>
