<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 64 64" width="{{ size }}" height="{{ size }}" role="img" aria-label="{{ label }}" style="display:block;overflow:visible;">
<g style="display:{{ showHeadset }};"><path d="M13 34 Q12 9 32 10 Q52 9 51 34" fill="none" stroke="#0B1026" stroke-width="7" stroke-linecap="round"></path><path d="M13 34 Q12 9 32 10 Q52 9 51 34" fill="none" stroke="#F2F4FF" stroke-width="3" stroke-linecap="round"></path></g>
<circle cx="{{ armLx }}" cy="{{ armY }}" r="5.5" fill="{{ color }}" stroke="#0B1026" stroke-width="3"></circle>
<circle cx="{{ armRx }}" cy="{{ armY }}" r="5.5" fill="{{ color }}" stroke="#0B1026" stroke-width="3"></circle>
<circle cx="32" cy="36" r="21" fill="{{ color }}" stroke="#0B1026" stroke-width="3.5"></circle>
<rect x="19" y="25" width="26" height="17" rx="8.5" fill="#1F2852" stroke="#0B1026" stroke-width="3"></rect>
<circle cx="27" cy="33" r="2.4" fill="#F2F4FF"></circle>
<circle cx="37" cy="33" r="2.4" fill="#F2F4FF"></circle>
<path d="{{ mouth }}" fill="{{ mouthFill }}" stroke="#F2F4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<g style="display:{{ showWorry }};"><path d="M24 29 L29 30.5 M40 29 L35 30.5" stroke="#F2F4FF" stroke-width="1.8" stroke-linecap="round"></path><path d="M50 18 Q53 23 50 25 Q47 23 50 18 Z" fill="#62B4FF" stroke="#0B1026" stroke-width="2"></path></g>
<rect x="26" y="49" width="12" height="6" rx="3" fill="#F2F4FF" stroke="#0B1026" stroke-width="2.5"></rect>
<g style="display:{{ showGoggles }};"><rect x="12" y="18" width="40" height="5" rx="2.5" fill="#0B1026"></rect><circle cx="24" cy="19" r="6.5" fill="#4FD8C8" stroke="#0B1026" stroke-width="3"></circle><circle cx="40" cy="19" r="6.5" fill="#4FD8C8" stroke="#0B1026" stroke-width="3"></circle><circle cx="22" cy="17" r="1.8" fill="#F2F4FF"></circle><circle cx="38" cy="17" r="1.8" fill="#F2F4FF"></circle></g>
<g style="display:{{ showWrench }};" transform="{{ wrenchT }}"><path d="M54 43 L61 30" stroke="#0B1026" stroke-width="7" stroke-linecap="round"></path><path d="M54 43 L61 30" stroke="#C3CAEE" stroke-width="3.5" stroke-linecap="round"></path><circle cx="62" cy="27" r="5" fill="none" stroke="#0B1026" stroke-width="6"></circle><circle cx="62" cy="27" r="5" fill="none" stroke="#C3CAEE" stroke-width="3"></circle><rect x="60" y="20" width="5" height="5" fill="{{ bg }}"></rect></g>
<g style="display:{{ showHeadset }};"><rect x="7" y="29" width="9" height="14" rx="4" fill="#F2F4FF" stroke="#0B1026" stroke-width="3"></rect><rect x="48" y="29" width="9" height="14" rx="4" fill="#F2F4FF" stroke="#0B1026" stroke-width="3"></rect><path d="M12 43 Q14 50 22 50" fill="none" stroke="#0B1026" stroke-width="3" stroke-linecap="round"></path><circle cx="23" cy="50" r="3" fill="#F2F4FF" stroke="#0B1026" stroke-width="2.5"></circle></g>
<g style="display:{{ showHat }};"><path d="M15 21 Q15 5 32 5 Q49 5 49 21 Z" fill="#FFD166" stroke="#0B1026" stroke-width="3" stroke-linejoin="round"></path><rect x="30" y="4" width="4" height="17" rx="2" fill="#0B1026" opacity="0.25"></rect><rect x="10" y="19" width="44" height="6" rx="3" fill="#FFD166" stroke="#0B1026" stroke-width="3"></rect></g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;base&quot;,&quot;science&quot;,&quot;spacecraft&quot;,&quot;ground&quot;,&quot;launch&quot;],&quot;default&quot;:&quot;science&quot;,&quot;tsType&quot;:&quot;'base'|'science'|'spacecraft'|'ground'|'launch'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;tsType&quot;:&quot;number&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;cheer&quot;,&quot;worried&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;'neutral'|'cheer'|'worried'&quot;},&quot;bg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#151C3D&quot;,&quot;tsType&quot;:&quot;string&quot;}}">class Component extends DCLogic {
  pose() {
    const m = this.props.mood ?? 'neutral';
    if (m === 'cheer') return { armLx: 8, armRx: 56, armY: 16, wrenchT: 'translate(3 -28)', mouth: 'M27 36.5 Q32 42 37 36.5 Z', mouthFill: '#F2F4FF', showWorry: 'none' };
    if (m === 'worried') return { armLx: 15, armRx: 49, armY: 51, wrenchT: 'translate(-4 7)', mouth: 'M28 39.5 Q32 36.5 36 39.5', mouthFill: 'none', showWorry: 'inline' };
    return { armLx: 11, armRx: 53, armY: 44, wrenchT: '', mouth: 'M28 37.5 Q32 40.5 36 37.5', mouthFill: 'none', showWorry: 'none' };
  }
  renderVals() {
    const role = this.props.role ?? 'science';
    const M = {
      base: ['#C3CAEE', 'Crew base'],
      science: ['#7FE28E', 'Science lead with goggles'],
      spacecraft: ['#62B4FF', 'Spacecraft engineer with wrench'],
      ground: ['#FF93B8', 'Ground operator with headset'],
      launch: ['#FF8552', 'Launch chief with hard hat'],
    }[role] || ['#C3CAEE', 'Crew'];
    const d = k => (role === k ? 'inline' : 'none');
    return {
      size: this.props.size ?? 56, color: M[0], label: M[1], bg: this.props.bg ?? '#151C3D',
      showGoggles: d('science'), ...this.pose(), showWrench: d('spacecraft'), showHeadset: d('ground'), showHat: d('launch'),
    };
  }
}</script>
</body>
</html>
