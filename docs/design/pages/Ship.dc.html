<x-dc>

<style>

</style>

<circle cx="120" cy="118" r="9" fill="#1F2852" stroke="#0B1026" stroke-width="3"></circle><circle cx="117" cy="115" r="2.5" fill="#F2F4FF"></circle>
</g>

<g style="display:{{ A.ghost }};"><circle cx="176" cy="66" r="20" fill="none" stroke="#FF93B8" stroke-width="2.5" stroke-dasharray="6 6"></circle><text x="176" y="73" text-anchor="middle" font-family="Fredoka" font-size="18" fill="#FF93B8">▲</text></g>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:320},&quot;payload&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;camera&quot;,&quot;prism&quot;,&quot;radar&quot;,&quot;weather&quot;],&quot;default&quot;:&quot;radar&quot;,&quot;tsType&quot;:&quot;'camera'|'prism'|'radar'|'weather'|null&quot;},&quot;power&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;big&quot;,&quot;hybrid&quot;],&quot;default&quot;:&quot;big&quot;,&quot;tsType&quot;:&quot;'small'|'big'|'hybrid'|null&quot;},&quot;antenna&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;polar&quot;,&quot;relay&quot;],&quot;default&quot;:&quot;polar&quot;,&quot;tsType&quot;:&quot;'small'|'polar'|'relay'|null&quot;},&quot;launcher&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;medium&quot;,&quot;heavy&quot;],&quot;default&quot;:&quot;medium&quot;,&quot;tsType&quot;:&quot;'small'|'medium'|'heavy'|null&quot;},&quot;bad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;payload&quot;,&quot;power&quot;,&quot;antenna&quot;,&quot;launcher&quot;],&quot;default&quot;:null,&quot;tsType&quot;:&quot;'payload'|'power'|'antenna'|'launcher'|null&quot;},&quot;badText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:260,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  layer(val, opts, key, bad) {
    const o = { ghost: val ? 'none' : 'inline', bad: bad === key && val ? 'inline' : 'none' };
    opts.forEach(k => { o[k] = val === k ? 'inline' : 'none'; });
    o.op = bad === key && val ? 0.5 : 1;
    o.anim = bad === key && val ? 'shipShake 420ms ease-in-out 1' : 'none';
    return o;
  }
  renderVals() {
    const p = this.props, bad = p.bad ?? null;
    const N = { camera: 'High-Res Camera', prism: 'Multispectral Imager', radar: 'Imaging Radar', weather: 'Weather Imager',
      small: 'standard', big: 'extended', hybrid: 'solar + battery hybrid', polar: 'polar-tracking', relay: 'big relay' };
    const parts = [
      p.payload ? N[p.payload] + ' payload' : 'empty payload slot',
      p.power ? N[p.power] + ' solar panels' : 'empty power slot',
      p.antenna ? (p.antenna === 'small' ? 'small' : N[p.antenna]) + ' antenna' : 'empty antenna slot',
      p.launcher ? p.launcher + ' rocket' : 'empty launcher slot',
    ];
    const h = p.height ?? 260;
    return {
      h, w: Math.round(h * 0.75),
      desc: 'Spacecraft: ' + parts.join(', ') + '.' + (bad ? ' Warning: the ' + bad + ' part does not fit. ' + (p.badText || '') : ''),
      Y: this.layer(p.payload, ['camera', 'prism', 'radar', 'weather'], 'payload', bad),
      P: this.layer(p.power, ['small', 'big', 'hybrid'], 'power', bad),
      A: this.layer(p.antenna, ['small', 'polar', 'relay'], 'antenna', bad),
      L: this.layer(p.launcher, ['small', 'medium', 'heavy'], 'launcher', bad),
    };
  }
}
</script>
</body>
</html>
