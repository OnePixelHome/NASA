<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>@media (prefers-reduced-motion: reduce){button{transition:none!important;transform:none!important}}</style>
</helmet>
<div style="box-sizing:border-box;width:{{ frameW }};background:#0B1026;color:#F2F4FF;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;display:flex;flex-direction:column;">
<dc-import name="AppHeader" hint-size="100%,57px"></dc-import>
<div style="display:flex;flex-direction:column;gap:20px;padding:{{ pad }};">
<header style="display:flex;flex-direction:column;gap:6px;">
<span style="font:700 12px/1.2 'Atkinson Hyperlegible';letter-spacing:.1em;text-transform:uppercase;color:#969FCC;">Screen 1 of 6</span>
<h1 style="margin:0;font:600 {{ titleSize }}/1.15 Fredoka,sans-serif;">1 · Pick your mission</h1>
<p style="margin:0;max-width:60ch;font-size:16px;line-height:1.5;color:#C3CAEE;text-wrap:pretty;">Every mission starts with a science goal. It decides what 'success' means.</p>
</header>
<sc-if value="{{ showDiff }}" hint-placeholder-val="{{ false }}">
<div role="group" aria-labelledby="diff-label" style="display:flex;flex-direction:column;gap:8px;padding:12px;border:2px dashed #C29BFF;border-radius:12px;">
<span style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;"><span id="diff-label" style="font:600 15px Fredoka;color:#F2F4FF;">Difficulty</span><span style="padding:2px 8px;border-radius:999px;background:#C29BFF;color:#0B1026;font:700 12px 'Atkinson Hyperlegible';">Proposal · needs engine work</span></span>
<div style="display:flex;padding:4px;gap:4px;background:#151C3D;border:1px solid #34407A;border-radius:999px;max-width:420px;">
<sc-for list="{{ diffs }}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{ d.onPick }}" aria-pressed="{{ d.pressed }}" style="all:unset;box-sizing:border-box;flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;background:{{ d.bg }};color:{{ d.color }};font:600 15px Fredoka;cursor:pointer;" style-focus="outline:3px solid #F2F4FF;outline-offset:2px;">{{ d.mark }}{{ d.label }}</button>
</sc-for>
</div>
<span style="font-size:13px;line-height:1.4;color:#C3CAEE;">{{ diffHint }}</span>
</div>
</sc-if>
<div style="display:flex;align-items:flex-start;gap:10px;">
<dc-import name="Character" role="science" size="52" bg="#0B1026" hint-size="52px,52px"></dc-import>
<span style="position:relative;margin-top:6px;padding:8px 12px;background:#F2F4FF;color:#0B1026;border-radius:12px;font:700 14px/1.35 'Atkinson Hyperlegible';"><span style="position:absolute;left:-5px;top:12px;width:10px;height:10px;background:#F2F4FF;transform:rotate(45deg);"></span><span style="position:relative;">Pick the goal first. It decides what success means.</span></span>
</div>
<div style="display:grid;grid-template-columns:{{ cols }};gap:16px;">
<sc-for list="{{ missions }}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{ m.onPick }}" aria-label="{{ m.aria }}" style="all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;min-height:44px;padding:12px 12px 16px;background:#151C3D;border:2px solid #34407A;border-radius:18px;box-shadow:0 2px 0 #0006, 0 8px 24px #0005;cursor:pointer;transition:transform 220ms cubic-bezier(.3,1.3,.5,1), box-shadow 220ms, border-color 120ms;" style-hover="transform:translateY(-4px);border-color:#62B4FF;box-shadow:0 2px 0 #0006, 0 12px 32px #0007, 0 0 24px #62B4FF33;" style-focus="outline:3px solid #F2F4FF;outline-offset:3px;transform:translateY(-4px);box-shadow:0 2px 0 #0006, 0 12px 32px #0007, 0 0 24px #62B4FF33;" style-active="transform:translateY(-1px);">
<dc-import name="MissionArt" mission="{{ m.art }}" hint-size="100%,140px"></dc-import>
<div style="display:flex;flex-direction:column;gap:4px;padding:0 4px;">
<span style="font:600 20px/1.25 Fredoka,sans-serif;color:#F2F4FF;">{{ m.title }}</span>
<span style="font-size:15px;line-height:1.5;color:#C3CAEE;text-wrap:pretty;">{{ m.story }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px;padding:12px;margin:0 4px;background:#1F2852;border-radius:12px;">
<span style="display:flex;justify-content:space-between;gap:8px;align-items:center;font:700 12px 'Atkinson Hyperlegible';letter-spacing:.06em;text-transform:uppercase;color:#C3CAEE;">Mission requirements<sc-if value="{{ m.illustrative }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px dashed #34407A;font:700 12px 'Atkinson Hyperlegible';letter-spacing:0;text-transform:none;color:#C3CAEE;">illustrative</span></sc-if></span>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
<sc-for list="{{ m.reqs }}" as="r" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
<span style="font:600 22px/1.1 Fredoka;color:#F2F4FF;font-variant-numeric:tabular-nums;">{{ r.value }}</span>
<span style="font-size:12px;line-height:1.3;color:#C3CAEE;">{{ r.label }}</span>
</div>
</sc-for>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px;">
<span style="font-size:14px;color:#C3CAEE;">Budget</span>
<span style="font:600 22px Fredoka;color:#FFD166;font-variant-numeric:tabular-nums;">{{ m.budget }}</span>
</div>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1500},&quot;showDifficulty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile'|'desktop'&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  static MISSIONS = [
    { id: 'crop', art: 'crop', title: 'Crop Watch', story: 'Track the health of farmland worldwide (up to 60° latitude) every couple of weeks.',
      reqs: [{ value: '±60°', label: 'latitude reach' }, { value: 'Global', label: 'coverage' }, { value: '16 d', label: 'revisit' }], budget: '$200M', revisit: 'every 16 days', lat: '60' },
    { id: 'storm', art: 'storm', title: 'Storm Watch', story: 'Follow hurricanes over the Americas with a new image every few minutes.',
      reqs: [{ value: '±40°', label: 'latitude reach' }, { value: 'Regional', label: 'coverage' }, { value: '6 h', label: 'revisit' }], budget: '$300M', revisit: 'every 6 hours', lat: '40' },
    { id: 'ice', art: 'ice', title: 'Polar Ice', story: 'Measure how polar ice grows and shrinks through the seasons.', illustrative: true,
      reqs: [{ value: '±82°', label: 'latitude reach' }, { value: 'Polar', label: 'coverage' }, { value: '3 d', label: 'revisit' }], budget: '$250M', revisit: 'every 3 days', lat: '82' },
  ];
  state = { diff: 'standard' };
  renderVals() {
    const D = [['easy', 'Easy', 'Easy: every card also explains why it works.'], ['standard', 'Standard', 'Standard: numbers and locks, as designed.'], ['hard', 'Hard', 'Hard: numbers stay hidden until the scorecard.']];
    const cur = this.state.diff;
    const extra = {
      showDiff: !!this.props.showDifficulty, diffHint: D.find(d => d[0] === cur)[2],
      diffs: D.map(d => ({ label: d[1], mark: d[0] === cur ? '✓ ' : '', pressed: String(d[0] === cur), bg: d[0] === cur ? '#C29BFF' : 'transparent', color: d[0] === cur ? '#0B1026' : '#F2F4FF', onPick: () => this.setState({ diff: d[0] }) })),
    };
    return { ...extra, ...this.base() };
  }
  base() {
    const desk = (this.props.layout ?? 'mobile') === 'desktop';
    return {
      frameW: desk ? '1280px' : '390px', pad: desk ? '32px 40px 48px' : '20px 16px 32px', titleSize: desk ? '40px' : '28px',
      cols: desk ? 'repeat(3,minmax(0,1fr))' : 'minmax(0,1fr)',
      missions: Component.MISSIONS.map(m => ({ ...m, illustrative: !!m.illustrative,
        aria: `${m.title}: observe up to ${m.lat}° latitude, ${m.reqs[1].value.toLowerCase()} coverage, revisit ${m.revisit}, budget ${m.budget}${m.illustrative ? ' (illustrative numbers)' : ''}`,
        onPick: () => this.props.onPick?.(m.id) })),
    };
  }
}
</script>
</body>
</html>
