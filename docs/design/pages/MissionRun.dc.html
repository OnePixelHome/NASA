<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="box-sizing:border-box;width:{{ frameW }};background:#0B1026;color:#F2F4FF;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;display:flex;flex-direction:column;">
<dc-import name="AppHeader" hint-size="100%,57px"></dc-import>
<header style="display:flex;flex-direction:column;gap:10px;padding:{{ pad }};padding-bottom:0;">
<span style="font:700 12px/1.2 'Atkinson Hyperlegible';letter-spacing:.1em;text-transform:uppercase;color:#969FCC;">Screen 5 of 6</span>
<h1 style="margin:0;font:600 {{ titleSize }}/1.15 Fredoka,sans-serif;">5 · Mission simulation</h1>
<div style="display:flex;flex-direction:column;gap:6px;">
<div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;"><span style="color:#C3CAEE;">Mission progress</span><span style="font:600 15px Fredoka;font-variant-numeric:tabular-nums;">{{ progressText }}</span></div>
<div role="progressbar" aria-label="{{ progressAria }}" aria-valuenow="{{ step }}" aria-valuemin="0" aria-valuemax="6" style="height:12px;border-radius:999px;background:#151C3D;border:1px solid #34407A;overflow:hidden;"><div style="height:100%;width:{{ pct }};border-radius:999px;background:#FFB547;transition:width 1200ms linear;"></div></div>
</div>
</header>
<div style="display:grid;grid-template-columns:{{ cols }};gap:{{ gap }};padding:{{ pad }};align-items:start;">
<div style="position:{{ scenePos }};top:16px;z-index:2;min-width:0;">
<dc-import name="MissionScene" step="{{ step }}" orbit-id="SSO" crew-size="{{ crewSize }}" hint-size="100%,224px"></dc-import>
</div>
<ol aria-live="polite" aria-label="Mission timeline" style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;min-width:0;">
<sc-for list="{{ shown }}" as="s" hint-placeholder-count="1">
<li style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:{{ s.bg }};border:2px solid {{ s.border }};border-radius:12px;animation:cardIn 400ms cubic-bezier(.3,1.3,.5,1) both;">
<span aria-hidden="true" style="flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:{{ s.dot }};color:#0B1026;font:600 15px Fredoka;font-variant-numeric:tabular-nums;">{{ s.mark }}</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
<span style="font:600 16px/1.3 Fredoka,sans-serif;color:#F2F4FF;"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Step {{ s.n }} of 6: </span>{{ s.label }}</span>
<span style="font-size:15px;line-height:1.45;color:#C3CAEE;font-variant-numeric:tabular-nums;text-wrap:pretty;">{{ s.text }}</span>
</div>
</li>
</sc-for>
<sc-for list="{{ pending }}" as="p" hint-placeholder-count="5">
<li aria-hidden="true" style="display:flex;gap:12px;align-items:center;padding:10px 14px;border:2px dashed #34407A;border-radius:12px;">
<span style="flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:2px solid #34407A;color:#C3CAEE;font:600 15px Fredoka;">{{ p.n }}</span>
<span style="font:600 15px Fredoka;color:#C3CAEE;">{{ p.label }}</span>
</li>
</sc-for>
</ol>
</div>
<footer style="position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:{{ pad }};background:#0B1026;border-top:1px solid #34407A;">
<sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ skip }}" style="all:unset;box-sizing:border-box;flex:1 1 0;max-width:200px;min-height:52px;padding:0 12px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:999px;border:2px solid #34407A;background:#151C3D;color:#F2F4FF;font:600 16px Fredoka,sans-serif;cursor:pointer;" style-hover="border-color:#62B4FF;" style-focus="outline:3px solid #F2F4FF;outline-offset:3px;">Skip</button>
</sc-if>
<button type="button" onClick="{{ onDone }}" disabled="{{ running }}" aria-label="{{ doneAria }}" style="all:unset;box-sizing:border-box;flex:1 1 0;max-width:280px;min-height:52px;padding:0 12px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:999px;border:2px solid {{ doneBorder }};background:{{ doneBg }};color:{{ doneColor }};font:600 16px Fredoka,sans-serif;cursor:pointer;" style-focus="outline:3px solid #F2F4FF;outline-offset:3px;">See scorecard →</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1100},&quot;startStep&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile'|'desktop'&quot;}}">
class Component extends DCLogic {
  // Example lines; real text comes from the engine's timeline for `choice`.
  static STEPS = [
    { label: 'Launch', text: 'Medium rocket lifts 214 kg (capacity 480 kg to SSO).' },
    { label: 'Orbit reached', text: 'Sun-Synchronous Orbit: one lap every 98.9 min, 36 min in shadow.' },
    { label: 'First light', text: 'Multispectral Imager sees 30 m per pixel.' },
    { label: 'Daily operations', text: '9 of 12 Gbit/day reach Earth.' },
    { label: 'Coverage', text: 'Revisits each spot about every 16 days.' },
    { label: 'End of mission', text: '~10 years of operations. Budget used: $105M of $200M.' },
  ];
  constructor(p) { super(p); this.state = { step: p.autoplay ? 1 : Math.max(1, Math.min(6, p.startStep ?? 1)) }; }
  componentDidMount() { if (this.props.autoplay) this.start(); }
  componentWillUnmount() { clearInterval(this.t); }
  start() {
    clearInterval(this.t);
    this.t = setInterval(() => this.setState(s => {
      if (s.step >= 6) { clearInterval(this.t); return null; }
      return { step: s.step + 1 };
    }), 1300);
  }
  renderVals() {
    const desk = (this.props.layout ?? 'mobile') === 'desktop';
    const step = this.state.step, running = step < 6, S = Component.STEPS;
    return {
      frameW: desk ? '1280px' : '390px', pad: desk ? '28px 40px' : '20px 16px', titleSize: desk ? '40px' : '28px',
      cols: desk ? 'minmax(0,1.15fr) minmax(0,1fr)' : 'minmax(0,1fr)', gap: desk ? '32px' : '16px', scenePos: desk ? 'sticky' : 'static',
      crewSize: desk ? 80 : 52,
      step, pct: (step / 6 * 100) + '%', progressText: 'Step ' + step + ' of 6', progressAria: 'Mission progress: step ' + step + ' of 6',
      shown: S.slice(0, step).map((s, i) => {
        const cur = i === step - 1;
        return { ...s, n: i + 1, mark: cur && running ? String(i + 1) : '✓', bg: cur ? '#1F2852' : '#151C3D', border: cur ? '#FFB547' : '#34407A', dot: cur && running ? '#FFB547' : '#66E39A' };
      }),
      pending: S.slice(step).map((s, i) => ({ label: s.label, n: step + i + 1 })),
      running,
      skip: () => { clearInterval(this.t); this.setState({ step: 6 }); },
      doneAria: running ? 'See scorecard, available when the simulation ends' : 'See scorecard',
      doneBg: running ? '#1F2852' : '#FFD166', doneColor: running ? '#C3CAEE' : '#0B1026', doneBorder: running ? '#34407A' : '#FFD166',
      onDone: () => !running && this.props.onDone?.(),
    };
  }
}
</script>
</body>
</html>
