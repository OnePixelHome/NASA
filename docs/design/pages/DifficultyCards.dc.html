<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="box-sizing:border-box;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#F2F4FF;">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:8px;">
<span style="font:600 15px Fredoka;color:#C29BFF;">{{ m.title }}</span>
<div style="position:relative;display:flex;">
<div style="flex:1;display:flex;flex-direction:column;gap:4px;min-height:96px;padding:12px 12px 10px;border:2px solid #34407A;border-radius:12px;background:#151C3D;box-shadow:0 2px 0 #0006, 0 8px 24px #0005;">
<span style="font:600 15px/1.25 Fredoka,sans-serif;padding-right:28px;">Multispectral Imager</span>
<span style="font-size:13px;line-height:1.35;color:#C3CAEE;font-variant-numeric:tabular-nums;">{{ m.fact }}</span>
<sc-if value="{{ m.easy }}" hint-placeholder-val="{{ false }}"><span style="margin-top:4px;padding:8px 10px;background:#1F2852;border-radius:8px;font-size:13px;line-height:1.4;color:#F2F4FF;"><span style="color:#66E39A;font-weight:700;">✓ Why it works: </span>Extra colors reveal crop health, and SSO keeps the lighting the same.</span></sc-if>
<span style="margin-top:auto;font:700 12px/1.3 'Atkinson Hyperlegible';color:#62B4FF;">○ Available</span>
</div>
<sc-if value="{{ m.showQ }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position:absolute;top:11px;right:11px;width:22px;height:22px;border-radius:999px;border:1.5px solid #34407A;background:#1F2852;display:flex;align-items:center;justify-content:center;font:700 13px Fredoka;color:#C3CAEE;">?</span></sc-if>
</div>
<span style="font-size:13px;line-height:1.4;color:#C3CAEE;">{{ m.note }}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:260}}">
class Component extends DCLogic {
  renderVals() {
    return { modes: [
      { title: 'Easy', fact: '8 colors of light · 150 kg', easy: true, showQ: false, note: 'Explanation shown inline; no “?” needed.' },
      { title: 'Standard', fact: '8 colors of light · 150 kg', easy: false, showQ: true, note: 'As designed: facts plus “?” for Why it works.' },
      { title: 'Hard', fact: '8 colors of light · ?? kg', easy: false, showQ: true, note: 'Numbers masked as “??” until the scorecard. Locks still show.' },
    ] };
  }
}
</script>
</body>
</html>
